<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal Admin — TEKDROID TV</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <div class="login-brand">
        <svg viewBox="0 0 32 32"><defs><linearGradient id="logoLogin" x1="5" y1="4" x2="27" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7dd3fc"/><stop offset="0.45" stop-color="#0ea5e9"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs><rect x="2.5" y="6" width="27" height="20" rx="6.2" fill="url(#logoLogin)"/><path d="M13.2 12.15v7.7l6.7-3.85z" fill="#fff"/><circle cx="24.15" cy="10.55" r="1.25" fill="#fff"/></svg>
        <div><strong>Portal Admin</strong><span>TEKDROID TV</span></div>
      </div>
      <label class="field">
        <span>Username</span>
        <input type="text" id="loginUsername" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </label>
      <p class="error" id="loginError" hidden></p>
      <button class="btn primary" type="submit">Masuk</button>
    </form>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="nav">
      <div class="nav-brand">
        <svg viewBox="0 0 32 32"><defs><linearGradient id="logoNav" x1="5" y1="4" x2="27" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7dd3fc"/><stop offset="0.45" stop-color="#0ea5e9"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs><rect x="2.5" y="6" width="27" height="20" rx="6.2" fill="url(#logoNav)"/><path d="M13.2 12.15v7.7l6.7-3.85z" fill="#fff"/><circle cx="24.15" cy="10.55" r="1.25" fill="#fff"/></svg>
        <div><strong id="navSiteName">TEKDROID TV</strong><span>Portal Admin</span></div>
      </div>
      <nav id="navLinks">
        <a href="#ringkasan" data-page="ringkasan">Ringkasan</a>
        <a href="#channel" data-page="channel">Pengaturan Channel</a>
        <a href="#tampilan" data-page="tampilan">Pengaturan Tampilan</a>
        <a href="#streaming" data-page="streaming">Pengaturan Streaming</a>
        <a href="#pembayaran" data-page="pembayaran">Pengaturan Pembayaran</a>
        <a href="#akun" data-page="akun">Akun Admin</a>
      </nav>
      <div class="nav-foot">
        <a class="btn ghost block" href="/" target="_blank" rel="noopener">Buka situs ↗</a>
        <button class="btn ghost block" id="logoutBtn" type="button">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Ringkasan</h1>
        <div class="savebar">
          <span class="dirty" id="dirtyNote" hidden>Ada perubahan yang belum disimpan</span>
          <button class="btn ghost" id="discardBtn" type="button" hidden>Batalkan</button>
          <button class="btn primary" id="saveBtn" type="button" disabled>Simpan perubahan</button>
        </div>
      </header>
      <section class="page" id="page"></section>
    </main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <header><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose" type="button" aria-label="Tutup">✕</button></header>
      <div class="modal-body" id="modalBody"></div>
      <footer id="modalFoot"></footer>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
