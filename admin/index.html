<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal Admin — TV Nusantara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='19' rx='4' fill='%23e5203a'/%3E%3Cpath d='M13 11v9l8-4.5z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <div class="login-brand">
        <svg viewBox="0 0 32 32"><rect x="2" y="6" width="28" height="19" rx="4" fill="#e5203a"/><path d="M13 11v9l8-4.5z" fill="#fff"/></svg>
        <div><strong>Portal Admin</strong><span>TV Nusantara</span></div>
      </div>
      <label class="field">
        <span>Password admin</span>
        <input type="password" id="loginPassword" autocomplete="current-password" required autofocus>
      </label>
      <p class="error" id="loginError" hidden></p>
      <button class="btn primary" type="submit">Masuk</button>
      <p class="muted small">Password awal ditampilkan di terminal saat server pertama kali dijalankan.</p>
    </form>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="nav">
      <div class="nav-brand">
        <svg viewBox="0 0 32 32"><rect x="2" y="6" width="28" height="19" rx="4" fill="#e5203a"/><path d="M13 11v9l8-4.5z" fill="#fff"/></svg>
        <div><strong id="navSiteName">TV Nusantara</strong><span>Portal Admin</span></div>
      </div>
      <nav id="navLinks">
        <a href="#ringkasan" data-page="ringkasan">Ringkasan</a>
        <a href="#channel" data-page="channel">Pengaturan Channel</a>
        <a href="#tampilan" data-page="tampilan">Pengaturan Tampilan</a>
        <a href="#streaming" data-page="streaming">Pengaturan Streaming</a>
        <a href="#pembayaran" data-page="pembayaran">Pengaturan Pembayaran</a>
        <a href="#akun" data-page="akun">Akun Admin</a>
      </nav>
      <div class="nav-foot">
        <a class="btn ghost block" href="/" target="_blank" rel="noopener">Buka situs ↗</a>
        <button class="btn ghost block" id="logoutBtn" type="button">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Ringkasan</h1>
        <div class="savebar">
          <span class="dirty" id="dirtyNote" hidden>Ada perubahan yang belum disimpan</span>
          <button class="btn ghost" id="discardBtn" type="button" hidden>Batalkan</button>
          <button class="btn primary" id="saveBtn" type="button" disabled>Simpan perubahan</button>
        </div>
      </header>
      <section class="page" id="page"></section>
    </main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <header><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose" type="button" aria-label="Tutup">✕</button></header>
      <div class="modal-body" id="modalBody"></div>
      <footer id="modalFoot"></footer>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
