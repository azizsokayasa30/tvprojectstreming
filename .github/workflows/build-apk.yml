name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Alamat server Wi-Fi cadangan (dipakai bila alamat online tidak bisa dihubungi)'
        required: false
        default: 'http://192.168.2.100:8080'

permissions:
  contents: write

jobs:
  build:
    # Image ini sudah membawa Android SDK (ANDROID_HOME).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apk
    env:
      SERVER_URL: ${{ github.event.inputs.server_url || vars.APK_SERVER_URL || 'http://192.168.2.100:8080' }}
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cek Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependency
        run: npm install --no-audit --no-fund

      - name: Siapkan konfigurasi, ikon, dan proyek Android
        run: |
          node scripts/prepare.js "$SERVER_URL"
          npx cap add android
          cp native/*.java android/app/src/main/java/id/tekdroid/tv/
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Izinkan HTTP & atur versi
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<item name="android:background">@drawable/splash</item>|&\n        <item name="windowSplashScreenBackground">#06121f</item>|' android/app/src/main/res/values/styles.xml
          grep -q windowSplashScreenBackground android/app/src/main/res/values/styles.xml
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/" android/app/build.gradle

      - name: Build APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TEKDROID-TV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TEKDROID-TV-apk
          path: TEKDROID-TV.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: TEKDROID TV APK 1.0.${{ github.run_number }}
          body: |
            Unduh **TEKDROID-TV.apk** di bawah lalu pasang di HP Android (izinkan "Instal aplikasi tidak dikenal").
            Aplikasi otomatis mencari alamat server online terbaru (dijalankan lewat "TEKDROID TV Online" di komputer server), jadi bisa dipakai dari jaringan mana pun.
            Cadangan saat satu Wi-Fi dengan server: `${{ env.SERVER_URL }}`
          files: TEKDROID-TV.apk
          make_latest: true
